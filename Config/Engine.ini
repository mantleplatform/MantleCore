; Nanite data for every place model is made at upload (FMantleMeshNaniteBake). The engine reads these two switches once, at startup, and
; builds without them what the bake asks for in a quieter form: Voxelize (plant models) becomes plain Nanite, and a Nanite assembly
; (a model made of placed parts) is not built at all. A creator's project usually has Nanite Foliage off, so the plugin switches both on
; itself. Engine plugins' Engine.ini is merged into the engine config before [SystemSettings] are applied, as AutomatedPerfTesting's is.
; The first start after this changes recompiles shaders once.
[SystemSettings]
r.Nanite.AllowVoxels=1
r.Nanite.AllowAssemblies=1
