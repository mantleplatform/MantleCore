[CoreRedirects]
; Mantle Place Settings' Outdoors (Automatic / Outdoors / Interior) became Indoor or Outdoor (Outdoor / Indoor).
; A level saved with the old setting loads with the same choice: Interior as Indoor; Outdoors and Automatic as Outdoor.
+PropertyRedirects=(OldName="/Script/MantleEditor.MantlePlaceSettingsActor.Outdoors", NewName="IndoorOutdoor")
+EnumRedirects=(OldName="/Script/MantleEditor.EMantlePlaceOutdoors", NewName="/Script/MantleEditor.EMantlePlaceIndoorOutdoor", ValueChanges=(("Automatic","Outdoor"),("Outdoors","Outdoor"),("Interior","Indoor")) )
